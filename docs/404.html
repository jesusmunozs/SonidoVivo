<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Sonido Vivo...</title>
    <script>
        // Redirige al root de la app en GitHub Pages conservando la navegación SPA
        var path = window.location.pathname;
        var repoName = '/SonidoVivo/';
        if (path.indexOf(repoName) !== -1) {
            window.location.replace(repoName);
        } else {
            window.location.replace('./');
        }
    </script>
</head>
<body style="background-color: #121026; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 20px;">
        <p style="color: #a0a0b0; font-size: 1.1rem; margin-bottom: 1rem;">Redirigiendo a Sonido Vivo...</p>
        <p><a href="./" style="color: #4fa8ff; text-decoration: none; font-weight: bold;">Haz clic aquí si no eres redirigido automáticamente</a></p>
    </div>
</body>
</html>
